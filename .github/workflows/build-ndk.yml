name: NDK build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - 'master'
      - 'main'
      - 'dev/*'
      - 'feat/*'
      - 'fix/*'
  pull_request:
    branches:
        - 'master'
        - 'main'
        - 'dev/*'
        - 'feat/*'
        - 'fix/*'
        - 'codex/**'

# Tagged builds publish only the validated QMOD through GitHub's release API.
# The unstripped native binary remains a short-lived Actions artifact for
# crash symbolization and is never attached to the public release.
permissions:
  contents: write

env:
    module_id: "bigscreen"
    qmod_name: "Big Screen"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      name: Checkout
      with:
        submodules: true
        lfs: true

    # CI intentionally installs the same minimal host package set documented
    # for native Linux and WSL. Project toolchains and dependencies are then
    # restored by the same hash-verifying bootstrap used by every developer.
    - name: Install canonical Linux host prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential ca-certificates cmake curl ffmpeg \
          libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
          ninja-build pkg-config python3 unzip xz-utils

    # get version from pushed tag
    - name: Extract version
      if: startsWith(github.ref, 'refs/tags/v')
      id: version
      run: |
        echo "TAG=${GITHUB_REF#refs/tags/}" >> ${GITHUB_OUTPUT}

    - name: Validate release tag against tracked package metadata
      if: startsWith(github.ref, 'refs/tags/v')
      run: python3 ./scripts/build_pipeline.py validate-release --tag "${{ steps.version.outputs.TAG }}"

    - name: Build, test, audit, and package through the canonical pipeline
      run: bash ./Build-QMOD-Linux.sh

    - name: Validate release tag against the packaged manifest
      if: startsWith(github.ref, 'refs/tags/v')
      run: python3 ./scripts/build_pipeline.py validate-release --tag "${{ steps.version.outputs.TAG }}" --qmod "./Big Screen.qmod"

    # The canonical Linux suite exercises the shared Python ownership policy.
    # Run the Windows-facing PowerShell policy implementations as independent
    # CI fixtures too, preventing host-specific deploy/package behavior from
    # drifting without making PowerShell a local Linux build prerequisite.
    - name: Verify Windows ownership and package policy fixtures
      shell: pwsh
      run: |
        ./tests/SourceInstallOwnershipTests.ps1
        ./tests/QuestDependencyCheckTests.ps1
        ./tests/DeterministicZipTests.ps1

    - name: Verify release and symbol outputs
      run: |
        library="lib${module_id}.so"
        test -f "./build/${library}"
        test -f "./build/debug/${library}"

    - name: Upload Actions-only native debug symbols
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: Big-Screen-native-debug-symbols-${{ github.sha }}
        path: ./build/debug/libbigscreen.so
        if-no-files-found: error
        retention-days: 14

    - name: Upload qmod artifact
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: ${{env.qmod_name}}.qmod
        path: ./${{ env.qmod_name }}.qmod
        if-no-files-found: error

    - name: Publish QMOD-only release
      if: startsWith(github.ref, 'refs/tags/v')
      id: upload_file_release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        tag_name: ${{ steps.version.outputs.TAG }}
        draft: false
        generate_release_notes: true
        files: |
          ./${{ env.qmod_name }}.qmod
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
