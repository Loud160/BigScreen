name: NDK build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - 'master'
      - 'main'
      - 'dev/*'
      - 'feat/*'
      - 'fix/*'
  pull_request:
    branches:
        - 'master'
        - 'main'
        - 'dev/*'
        - 'feat/*'
        - 'fix/*'

# Tagged builds publish the validated QMOD and native debug artifacts through
# GitHub's release API. The default read-only token cannot create that release.
permissions:
  contents: write

env:
    module_id: "bigscreen"
    qmod_name: "Big Screen"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      name: Checkout
      with:
        submodules: true
        lfs: true

    # CI intentionally installs the same minimal host package set documented
    # for native Linux and WSL. Project toolchains and dependencies are then
    # restored by the same hash-verifying bootstrap used by every developer.
    - name: Install canonical Linux host prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential ca-certificates cmake curl ffmpeg \
          libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
          ninja-build pkg-config python3 unzip xz-utils

    # get version from pushed tag
    - name: Extract version
      if: startsWith(github.ref, 'refs/tags/v')
      id: version
      run: |
        echo "TAG=${GITHUB_REF#refs/tags/}" >> ${GITHUB_OUTPUT}
        echo "VERSION=${GITHUB_REF#refs/tags/v}" >> ${GITHUB_OUTPUT}

    - name: Build, test, audit, and package through the canonical pipeline
      run: bash ./Build-QMOD-Linux.sh

    - name: Get Library Name
      id: libname
      run: |
        library="lib${module_id}.so"
        test -f "./build/${library}"
        test -f "./build/debug/${library}"
        echo "NAME=${library}" >> ${GITHUB_OUTPUT}

    - name: Upload artifact
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: ${{ steps.libname.outputs.NAME }}
        path: ./build/${{ steps.libname.outputs.NAME }}
        if-no-files-found: error

    - name: Upload qmod artifact
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: ${{env.qmod_name}}.qmod
        path: ./${{ env.qmod_name }}.qmod
        if-no-files-found: error

    # if we had a tag, we should make a release
    - name: Upload release artifacts
      if: startsWith(github.ref, 'refs/tags/v')
      id: upload_file_release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        tag_name: ${{ steps.version.outputs.TAG }}
        draft: false
        generate_release_notes: true
        files: |
          ./${{ env.qmod_name }}.qmod
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
